[package]
name = "waybar_nzquake"
version = "0.1.0"
edition = "2021"
description = "Waybar widget for New Zealand earthquake data from GeoNet"
license = "MIT"
repository = "https://github.com/pukeko37/waybar_nzquake"

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["parsing", "formatting", "std", "macros", "local-offset"] }
anyhow = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
